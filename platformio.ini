; Uzumaru firmware - PlatformIO project
; https://docs.platformio.org/page/projectconf.html
;
; This project tracks the latest releases of the platform and all libraries.
; CI builds weekly to catch upstream breakage early. Pin a dependency only
; when it really has to be, and put a comment next to the pin saying why.
;
; Boards: pins and power budget live in src/boards/*.h, selected by the
; UZUMARU_BOARD_* flag of each environment below.

[platformio]
default_envs = m5stack_atomlite_s3

[common_env_data]
lib_deps =
    fastled/FastLED
    arkhipenko/TaskScheduler
    https://github.com/Fattoresaimon/ArduinoDuPPaLib.git

[env]
; The official platform, named with its owner: a bare "espressif32" can resolve
; to another installed platform of that name (e.g. pioarduino's), so local
; builds could differ from CI. Official 8.0+ has Arduino-ESP32 3.x (and C6).
platform = platformio/espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps = ${common_env_data.lib_deps}
extra_scripts = merge-bin.py

; M5Stack Atom S3 Lite (ESP32-S3): current Uzumaru builds
[env:m5stack_atomlite_s3]
board = m5stack-atoms3
; USB_CDC_ON_BOOT: Serial goes over the USB-C port (drops output when no computer is attached)
build_flags =
    -D UZUMARU_BOARD_ATOM_S3
    -D ARDUINO_USB_CDC_ON_BOOT=1

; M5Stack Atom Lite / Atom Matrix (ESP32-PICO-D4): the first Uzumaru builds
[env:m5stack_atomlite]
board = pico32
build_flags = -D UZUMARU_BOARD_ATOM
